[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-loader"
version = "0.1.0"
description = "CLI tool for downloading airport charts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.32.0",
]

[project.scripts]
chart-loader = "chart_loader.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
